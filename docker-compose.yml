services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: church_management
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church -d church_management"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: build
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://church:church@postgres:5432/church_management
      DB_POOL_MAX: 10
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
